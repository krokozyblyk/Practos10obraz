route:
  receiver: app-webhook
  group_by: ["alertname", "source"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1m
  routes:
    - matchers:
        - source="app"
      receiver: app-webhook
      group_by: ["alertname", "source"]
    - matchers:
        - source="pc"
      receiver: pc-webhook
      group_by: ["alertname", "source"]

receivers:
  - name: app-webhook
    webhook_configs:
      - url: http://host.docker.internal:8099/webhook/app
        send_resolved: true
  - name: pc-webhook
    webhook_configs:
      - url: http://host.docker.internal:8099/webhook/pc
        send_resolved: true
